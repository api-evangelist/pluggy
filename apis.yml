aid: pluggy

name: Pluggy

description: Pluggy is a Brazilian Open Finance infrastructure company (pluggy.ai) offering APIs to connect bank data, collect payments and move
  money across Brazilian financial institutions. Its platform aggregates accounts, transactions, investments, credit card bills and identity data
  through direct and regulated Open Finance connectors, with the Pluggy Connect drop-in widget, a sandbox environment, a developer dashboard and
  an MCP server for developer tooling.

