openapi: 3.2.0
info:
  title: Pluggy Transaction API
  description: Pluggy's main API to review data and execute connectors
  license:
    name: MIT
  contact:
    email: hello@pluggy.ai
    name: Pluggy
    url: https://pluggy.ai
  version: 1.0.0
servers:
- url: https://api.pluggy.ai
  description: Pluggy API
tags:
- name: Transaction
  description: Financial transaction data and operations
paths:
  /transactions:
    get:
      operationId: transactions-list
      summary: List by Page (deprecated)
      description: '**Deprecated**: this endpoint is deprecated and will be available only until **2026-12-31**, after which it will be removed. Please migrate to `GET /v2/transactions`, which uses cursor-based pagination.


        Recovers all transactions collected for the acount provided.'
      deprecated: true
      responses:
        '200':
          description: Retrieve a list of all transactions for an account
