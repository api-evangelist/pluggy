openapi: 3.2.0
info:
  title: Pluggy Items API
  description: Pluggy's main API to review data and execute connectors
  license:
    name: MIT
  contact:
    email: hello@pluggy.ai
    name: Pluggy
    url: https://pluggy.ai
  version: 1.0.0
servers:
- url: https://api.pluggy.ai
  description: Pluggy API
tags:
- name: Items
  description: Item management for syncing financial data
paths:
  /items:
    post:
      operationId: items-create
      summary: Create
      responses:
        '200':
          description: Created item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCreationErrorResponse'
              examples:
                missingMainParameter:
                  summary: Missing main parameter
                  value:
                    message: Connector parameters do not match validation rules
                    code: 400
                    codeDescription: CONNECTOR_VALIDATION_ERROR
                    details:
                    - code: '001'
                      parameter: user
                      message: user parameter is required
                missingMFA:
                  summary: Missing MFA on parameters
                  value:
                    message: Connector parameters do not match validation rules
                    code: 400
                    codeDescription: CONNECTOR_VALIDATION_ERROR
                    details:
                    - code: '001'
                      parameter: token
                      message: token parameter is required
                itemUserAlreadyExists:
                  summary: Item user already exists, avoid duplicates detected.
                  value:
                    message: There are other items with the same credentials, you can't create a new one
                    code: 400
                    codeDescription: ITEM_USER_ALREADY_EXISTS
                    data:
                      items:
                      - d0f8a8c0-e8e3-11e9-b210-d663bd873d93
                      - d0f8a8c0-e8e3-11e9-b210-d663bd873d94
        '409':
          description: There is a conflict creating an item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              example:
                code: 409
                codeDescription: ITEM_CREATION_LIMIT_EXCEEDED
                message: Client exceeded item creation limit (100 items) for the current subscription level.
                data:
                  itemsLimit: 100
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              example:
                code: 500
                codeDescription: INTERNAL_SERVER_ERROR
                message: Internal Server Error
      description: Creates a item and syncs all the products with the financial institution, using as credentials the sent parameters.
      tags:
      - Items
      security:
      - default: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItem'
            examples:
              Plain parameters:
                value:
                  connectorId: 2
                  parameters:
                    user: user-ok
                    password: password-ok
                  webhookUrl: https://example.com/webhook
              Encrypted parameters:
                value:
                  connectorId: 2
                  parameters: encrypted-parameters
                  webhookUrl: https://example.com/webhook
        required: true
      x-readme:
        code-samples:
        - language: node
          code: "const pluggy = require('pluggy-sdk');\nconst client = new pluggy.PluggyClient({\n  clientId: 'YOUR_CLIENT_ID',\n  clientSecret: 'YOUR_CLIENT_SECRET',\n});\nclient\n  .createItem(2, { user: 'user-ok', password: 'password-ok' })\n  .then((item) => {\n    console.log(item);\n  });"
        - language: java
          code: "PluggyClient pluggyClient = PluggyClient.builder()\n  .clientIdAndSecret('your_client_id', 'your_secret')\n  .baseUrl('https://api.pluggy.ai')\n  .build();\nParametersMap parametersMap = ParametersMap.map(\"user\", \"user-ok\")\n  .with(\"password\", \"password-ok\");\nCreateItemRequest createItemRequest = new CreateItemRequest(connectorId, parametersMap);\nResponse<ItemResponse> item = pluggyClient.service().createItem(createItemRequest).execute();"
        - language: csharp
          code: 'PluggyClient pluggyClient = new PluggyClient(''YOUR_PLUGGY_API_KEY'');

            ItemParameters createItemRequest = new ItemParameters(connectorId, credentials, options);

            Item item = await pluggyClient.CreateItem(createItemRequest);'
  /items/{id}:
    get:
      operationId: items-retrieve
      summary: Retrieve
      responses:
        '200':
          description: Item was retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              example:
                code: 404
                codeDescription: ITEM_NOT_FOUND
                message: item not found
        '500':
          description: Server Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
      description: Recovers the item resource by its id
      tags:
      - Items
      security:
      - default: []
      parameters:
      - description: Item primary identifier
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        example: d0f8a8c0-e8e3-11e9-b210-d663bd873d93
      x-readme:
        code-samples:
        - language: node
          code: "const pluggy = require('pluggy-sdk');\nconst client = new pluggy.PluggyClient({\n  clientId: 'YOUR_CLIENT_ID',\n  clientSecret: 'YOUR_CLIENT_SECRET',\n});\nclient\n  .fetchItem('YOUR_ITEM_ID')\n  .then((item) => {\n    console.log(item);\n  });"
        - language: java
          code: "PluggyClient pluggyClient = PluggyClient.builder()\n  .clientIdAndSecret('your_client_id', 'your_secret')\n  .baseUrl('https://api.pluggy.ai')\n  .build();\nResponse<ItemResponse> item = pluggyClient.service().getItem(\"YOUR_ITEM_ID\").execute();"
        - language: csharp
          code: 'PluggyClient pluggyClient = new PluggyClient(''YOUR_PLUGGY_API_KEY'');

            Item item = await pluggyClient.FetchItem("YOUR_ITEM_ID");'
    patch:
      operationId: items-update
      summary: Update
      responses:
        '200':
          description: Update the item was successful, new sync was triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              examples:
                repeatedMFA:
                  summary: MFA should be updated
                  value:
                    code: 400
                    codeDescription: MFA_PARAMERTER_WAS_ALREADY_USED_ERROR
                    message: MFA parameter has to be updated from last execution
                missingMFA:
                  summary: MFA parameter was not sent
                  value:
                    message: The parameter 'token' is required to be renewed for item update.
                    code: 400
                    codeDescription: CONNECTOR_REQUIRED_PARAMETER_VALIDATION_ERROR
                    details:
                    - code: '001'
                      message: Parameter 'token' is required
                      parameter: token
                    data:
                      parameter: token
                tooManyErrors:
                  summary: There were more than 5 consecutive errors
                  value:
                    code: 400
                    codeDescription: TOO_MANY_CONSECUTIVE_ERRORS
                    message: There has been more than 5 failing syncronizations, please contact support
                tooManyConsecutiveLoginFailures:
                  summary: There were at least 2 consecutive login errors
                  value:
                    code: 400
                    codeDescription: TOO_MANY_CONSECUTIVE_LOGIN_FAILURES
                    message: 'must wait at least {readableBackoffTime} after {maxConsecutiveFailedLoginAttempts} consecutive login errors, last attempt was at {lastExecutionEndedAt} (can retry after: {canRetryAfterDate})'
                    data:
                      readableBackoffTime: 15 minutes
                      maxConsecutiveFailedLoginAttempts: 2
                      lastExecutionEndedAt: '2020-01-01T00:00:00.000Z'
                      canRetryAfterDate: '2020-01-01T00:15:00.000Z'
        '404':
          description: Item not found, or its connector was removed from Pluggy and the item can no longer be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              examples:
                itemNotFound:
                  summary: Item not found
                  value:
                    code: 404
                    codeDescription: ITEM_NOT_FOUND
                    message: item not found
                connectorRemoved:
                  summary: The item's connector was removed
                  value:
                    code: 404
                    codeDescription: CONNECTOR_NOT_FOUND
                    message: connector not found
        '409':
          description: There is a conflict updating the item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              example:
                code: 409
                codeDescription: CLIENT_IS_UPDATING_BEFORE_ALLOWED_FREQUENCY
                message: Client updates on this item are allowed at most every {minUpdateFrequencyAllowedInHours} hours. Last update was at {lastUpdatedAt}
                data:
                  minUpdateFrequencyAllowedInHours: 24
                  lastUpdatedAt: '2020-01-01T00:00:00.000Z'
        '500':
          description: Server Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
      description: Triggers new syncronization for the Item, optionally updating the stored credentials.
      tags:
      - Items
      security:
      - default: []
      parameters:
      - description: Item primary identifier
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        example: d0f8a8c0-e8e3-11e9-b210-d663bd873d93
      requestBody:
        description: Update item request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItem'
            examples:
              Plain parameters:
                value:
                  webhookUrl: https://example.com/webhook
                  clientUserId: My User App Id
                  parameters:
                    user: user-ok
                    password: password-ok
              Encrypted parameters:
                value:
                  webhookUrl: https://example.com/webhook
                  clientUserId: My User App Id
                  parameters: encrypted-parameters
      x-readme:
        code-samples:
        - language: node
          code: "const pluggy = require('pluggy-sdk');\nconst client = new pluggy.PluggyClient({\n  clientId: 'YOUR_CLIENT_ID',\n  clientSecret: 'YOUR_CLIENT_SECRET',\n});\nclient\n  .updateItem('YOUR_ITEM_ID')\n  .then((item) => {\n    console.log(item);\n  });"
        - language: java
          code: "PluggyClient pluggyClient = PluggyClient.builder()\n  .clientIdAndSecret('your_client_id', 'your_secret')\n  .baseUrl('https://api.pluggy.ai')\n  .build();\nResponse<ItemResponse> item = pluggyClient.service().updateItem(\"YOUR_ITEM_ID\").execute();"
        - language: csharp
          code: 'PluggyClient pluggyClient = new PluggyClient(''YOUR_PLUGGY_API_KEY'');

            Item item = await pluggyClient.UpdateItem("YOUR_ITEM_ID");'
    delete:
      operationId: items-delete
      summary: Delete
      description: Delete the item by its primary identifier
      responses:
        '200':
          description: Item was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICountResponse'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              example:
                code: 404
                codeDescription: ITEM_NOT_FOUND
                message: item not found
        '500':
          description: Server Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
      tags:
      - Items
      security:
      - default: []
      parameters:
      - description: Item primary identifier
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        example: d0f8a8c0-e8e3-11e9-b210-d663bd873d93
      x-readme:
        code-samples:
        - language: node
          code: "const pluggy = require('pluggy-sdk');\nconst client = new pluggy.PluggyClient({\n  clientId: 'YOUR_CLIENT_ID',\n  clientSecret: 'YOUR_CLIENT_SECRET',\n});\nclient\n  .deleteItem('YOUR_ITEM_ID');"
        - language: java
          code: "PluggyClient pluggyClient = PluggyClient.builder()\n  .clientIdAndSecret('your_client_id', 'your_secret')\n  .baseUrl('https://api.pluggy.ai')\n  .build();\nResponse<DeleteItemResponse> item = pluggyClient.service().deleteItem(\"YOUR_ITEM_ID\").execute();"
        - language: csharp
          code: 'PluggyClient pluggyClient = new PluggyClient(''YOUR_PLUGGY_API_KEY'');

            await pluggyClient.DeleteItem("YOUR_ITEM_ID");'
  /items/{id}/resources:
    get:
      operationId: items-resources
      summary: List Item resources
      description: 'Open Finance only. Lists the resources the financial institution declared for this item''s consent, exactly as the institution reported them.


        Use it to answer what a consent actually covers, and what the institution says about each part of it. A resource reported as `PENDING_AUTHORISATION` or `UNAVAILABLE` explains an absent product, and is something the end user can act on at their bank.


        Whether Pluggy holds the matching record is a separate question: use the product endpoints (`/accounts`, `/investments`, `/loans`) and the Item''s `statusDetail` for that.


        The list is a snapshot from the last execution that reached the institution, so it can be older than the item itself. The Item''s `resourcesCollectedAt` says when it was taken — and an empty list means the institution shared nothing only when that field is set; when it is `null`, the list was never obtained.


        Items on non Open Finance connectors return an empty page rather than an error.'
      responses:
        '200':
          description: The resources declared for the item's consent
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    format: double
                    description: ''
                  total:
                    type: number
                    format: double
                    description: ''
                  totalPages:
                    type: number
                    format: double
                    description: ''
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemResource'
                    description: List of declared resources
              examples:
                response:
                  value:
                    page: 1
                    total: 3
                    totalPages: 1
                    results:
                    - resourceId: 1f9a5e0c-3d2b-4a1e-9c7f-2b8d6e4a1c30
                      type: ACCOUNT
                      status: AVAILABLE
                    - resourceId: 6c2d8b41-7e5a-4f03-b19d-8a4e2c7f5b60
                      type: CREDIT_CARD_ACCOUNT
                      status: PENDING_AUTHORISATION
                    - resourceId: a3e71d92-5b48-4c6f-8e20-1d9c3b7a4e50
                      type: FUND
                      status: UNAVAILABLE
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              example:
                code: 404
                codeDescription: ITEM_NOT_FOUND
                message: item not found
        '500':
          description: Server Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
      tags:
      - Items
      security:
      - default: []
      parameters:
      - description: Item primary identifier
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        example: d0e8448e-0156-4b4a-ae6c-3e2a6d9bff5c
      - description: 'Page size for the paging request, default: 500'
        in: query
        name: pageSize
        required: false
        schema:
          type: number
          format: double
        example: '50'
      - description: 'Page number for the paging request, default: 1'
        in: query
        name: page
        required: false
        schema:
          type: number
          format: double
        example: '1'
      - description: Only resources with this status, spelled as Open Finance reports it. `PENDING_AUTHORISATION` lists what is still awaiting authorization at the institution.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
          - TEMPORARILY_UNAVAILABLE
          - PENDING_AUTHORISATION
        example: PENDING_AUTHORISATION
  /items/{id}/mfa:
    post:
      operationId: items-send-mfa
      summary: Send MFA
      description: When item is Waiting User Input, this method allows to submit multi-factor authentication value
      responses:
        '200':
          description: Parameter was sent correctly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              example:
                code: 404
                codeDescription: ITEM_NOT_FOUND
                message: item not found
        '500':
          description: Server Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
      tags:
      - Items
      security:
      - default: []
      parameters:
      - description: Item primary identifier
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        example: d0e8448e-0156-4b4a-ae6c-3e2a6d9bff5c
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
              description: Request with the MFA value provided by the user, in the format [name]:[value]
              additionalProperties:
                type: string
        required: true
      x-readme:
        code-samples:
        - language: node
          code: "const pluggy = require('pluggy-sdk');\nconst client = new pluggy.PluggyClient({\n  clientId: 'YOUR_CLIENT_ID',\n  clientSecret: 'YOUR_CLIENT_SECRET',\n});\nclient\n  .updateItemMFA('YOUR_ITEM_ID', { key: 'value' })\n.then((item) => console.log(item));"
        - language: java
          code: "PluggyClient pluggyClient = PluggyClient.builder()\n  .clientIdAndSecret('your_client_id', 'your_secret')\n  .baseUrl('https://api.pluggy.ai')\n  .build();\nResponse<ItemResponse> item = pluggyClient.service().updateItemSendMfa(\"YOUR_ITEM_ID\", new UpdateItemMfaRequest(\"key\", \"value\")).execute();"
        - language: csharp
          code: 'PluggyClient pluggyClient = new PluggyClient(''YOUR_PLUGGY_API_KEY'');

            var parameter = new ItemParameter("key", "value");

            Item item = await pluggyClient.UpdateItemMFA("YOUR_ITEM_ID", new List<ItemParameter> { parameter });'
  /items/{id}/disable-auto-sync:
    patch:
      operationId: items-disable-autosync
      summary: Disable item auto sync
      description: When client disables auto sync, the item will not be updated automatically anymore, until the client force an item update.
      responses:
        '200':
          description: Item auto sync was disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              example:
                code: 404
                codeDescription: ITEM_NOT_FOUND
                message: item not found
        '500':
          description: Server Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
      tags:
      - Items
      security:
      - default: []
      parameters:
      - description: Item primary identifier
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        example: d0e8448e-0156-4b4a-ae6c-3e2a6d9bff5c
  /v2/items:
    get:
      operationId: items-list-by-cursor
      summary: List
      description: 'Recovers your items using cursor-based pagination, most recently created first.


        This endpoint is opt-in: it is disabled by default and must be enabled for your team. Contact support if you want access.'
      responses:
        '200':
          description: Retrieve a list of your items using cursor-based pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPageResponseItems'
        '400':
          description: Missing or invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              examples:
                invalidCursor:
                  summary: Invalid cursor
                  value:
                    message: Invalid cursor
                    code: 400
                    codeDescription: INVALID_CURSOR
                invalidConnectorId:
                  summary: Invalid connectorId
                  value:
                    message: connectorId must be an integer number
                    code: 400
        '403':
          description: The feature is not enabled for this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
              examples:
                featureNotEnabled:
                  summary: Listing items is not enabled
                  value:
                    message: This client is not enabled to list its items.
                    code: 403
                    codeDescription: LIST_ITEMS_FEATURE_NOT_ENABLED
        '500':
          description: Server Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalErrorResponse'
      tags:
      - Items
      security:
      - default: []
      parameters:
      - description: Filter by the identifier you assigned to the end user
        in: query
        name: clientUserId
        required: false
        schema:
          type: string
          maxLength: 255
        example: user-1234
      - description: Filter by the institution (connector) identifier
        in: query
        name: connectorId
        required: false
        schema:
          type: integer
          minimum: 0
        example: 201
      - description: Cursor for the next page. Use the 'next' value of the previous response; do not build it yourself.
        in: query
        name: after
        required: false
        schema:
          type: string
components:
  schemas:
    StatusDetailProduct:
      description: Detailed status of the product
      type: object
      properties:
        lastUpdatedAt:
          type: string
          format: date-time
          description: Date when the product was last updated
        isUpdated:
          type: boolean
          description: Product was updated in the last execution
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/StatusDetailProductWarning'
          description: Warnings about the product data. For example, a warning about missing permissions for viewing a product
      example:
        isUpdated: true
        lastUpdatedAt: '2022-03-08T22:43:04.796Z'
    ConnectorIncident:
      description: 'An incident affecting a connector right now, as published on the Pluggy status page. Only incidents active at this moment are listed: a scheduled maintenance appears once its window opens, not when it is announced, and disappears when the window closes.'
      properties:
        id:
          type: string
          format: uuid
          description: Status page identifier of the incident
        title:
          type: string
          description: Short, customer-facing summary, for example 'XP Banking - Compras parceladas não sendo retornadas'
        description:
          type:
          - string
          - 'null'
          description: Longer explanation, when there is one
        type:
          enum:
          - CONNECTOR_UNAVAILABLE
          - CONNECTOR_DEGRADED
          - INSTITUTION_OUTAGE
          - SCHEDULED_MAINTENANCE
          - CONSENT_ERROR
          - CONNECTION_NOT_UPDATING
          - PARTIAL_SUCCESS
          - ACCOUNTS_MISSING
          - BALANCE_INCORRECT
          - TRANSACTIONS_MISSING
          - TRANSACTIONS_INCORRECT
          - TRANSACTIONS_INSTALLMENTS_ISSUE
          - INVESTMENTS_MISSING
          - INVESTMENTS_INCORRECT
          - IDENTITY_MISSING
          - HISTORICAL_DATA_MISSING
          - WEBHOOK_DELAY
          - PAYMENT_FAILURE
          - OTHER
          type: string
          description: 'What is broken, as opposed to how badly (severity) or how far along we are (state). Use it to group the same problem across institutions, and to decide which incidents are worth showing your own users: a SCHEDULED_MAINTENANCE and a TRANSACTIONS_MISSING both read as ''degraded'' otherwise. OTHER means Pluggy has not classified it, not that nothing is wrong'
        product:
          enum:
          - dados
          - pis
          - pis-agendado
          - pixauto
          - smart
          - infra
          type: string
          description: Which Pluggy product line the incident affects
        kind:
          enum:
          - INCIDENT
          - MAINTENANCE
          type: string
          description: Whether this is an unplanned incident or a planned maintenance window
        severity:
          enum:
          - DEGRADED
          - PARTIAL_OUTAGE
          - MAJOR_OUTAGE
          - MAINTENANCE
          type: string
          description: How badly the institution is affected
        state:
          enum:
          - INVESTIGATING
          - IDENTIFIED
          - MONITORING
          - SCHEDULED
          type: string
          description: Where the incident is in its lifecycle. Resolved incidents are not listed
        startedAt:
          type: string
          format: date-time
          description: When the incident began
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the incident was last updated
        url:
          type: string
          description: Permalink to the incident on the status page, with its full timeline and postmortem. Safe to show to your own users
      type: object
      required:
      - id
      - title
      - type
      - product
      - kind
      - severity
      - state
      - startedAt
      - url
    UpdateItem:
      description: Update Item Request
      properties:
        parameters:
          oneOf:
          - type: object
          - type: string
          properties: {}
          description: Parameters to update on the item stored credentials.
          additionalProperties:
            type: string
        clientUserId:
          type: string
          description: Client's external identifier for the user, it can be a ID, UUID or even an email. This is free for clients to use.
        webhookUrl:
          type: string
          format: uri
          description: Url to be notified of item changes
        products:
          type: array
          items:
            type: string
            enum:
            - ACCOUNTS
            - CREDIT_CARDS
